<ion-content class="ion-padding">
  <div class="ion-text-center" style="margin-top: 30%;">
    <h1>Hola, {{ nombre }}</h1>
    <p>Escanea el código QR de tu sala para realizar una solicitud.</p>

    <ion-button expand="block" size="large" (click)="realizarPeticion()">
      Realizar petición
    </ion-button>

    <ion-button expand="block" fill="clear" (click)="cerrarSesion()">
      Cerrar sesión
    </ion-button>
  </div>
</ion-content>
